<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueBattery - 차량 및 배터리 종합 관리</title>
    <!-- 토스페이먼츠 공식 v1 SDK -->
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f0f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; width: 100%; max-width: 460px; padding: 28px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 82, 204, 0.08); }
        h2 { color: #0052cc; margin-top: 0; text-align: center; font-size: 22px; margin-bottom: 24px; }
        .box { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid #e9ecef; }
        .box h3 { font-size: 15px; color: #333; margin-top: 0; margin-bottom: 12px; }
        input { width: 100%; padding: 12px 14px; margin: 5px 0; border: 1px solid #ced4da; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #0052cc; }
        button { width: 100%; padding: 13px; background-color: #0052cc; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: background 0.2s; }
        button:hover { background-color: #003d99; }
        .btn-group { display: flex; gap: 8px; }
        .btn-gray { background-color: #6c757d; }
        .btn-gray:hover { background-color: #5a6268; }
        .btn-pay { background-color: #28a745; }
        .btn-pay:hover { background-color: #218838; }
        .result-box { background: #f8f9fa; border: 1px solid #e9ecef; padding: 14px; border-radius: 8px; margin-top: 12px; font-size: 13px; line-height: 1.7; color: #212529; }
        .status { margin-top: 8px; font-size: 13px; font-weight: 600; }
        .status.success { color: #28a745; }
        .status.error { color: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚡ BlueBattery Service</h2>

    <!-- 1. 계정 인증 (로그인/회원가입) -->
    <div class="box">
        <h3>1. 사용자 계정 인증</h3>
        <input type="text" id="username" placeholder="아이디 입력">
        <input type="password" id="password" placeholder="비밀번호 입력">
        <div class="btn-group">
            <button onclick="handleAuth('/api/login')">로그인</button>
            <button class="btn-gray" onclick="handleAuth('/api/register')">회원가입</button>
        </div>
        <div id="auth-status" class="status"></div>
    </div>

    <!-- 2. 차량 정보 검색 -->
    <div class="box">
        <h3>2. 차량 실시간 정보 조회</h3>
        <input type="text" id="car-number" placeholder="차량 번호 입력 (예: 12가3456)">
        <button onclick="searchCar()">차량 정보 검색</button>
        <div id="car-result" class="result-box" style="display:none;"></div>
    </div>

    <!-- 3. 결제 테스트 -->
    <div class="box" style="border-bottom:none; margin-bottom: 0; padding-bottom: 0;">
        <h3>3. 이용권 구매 및 결제 테스트</h3>
        <input type="number" id="pay-amount" value="10000" placeholder="결제 금액">
        <button class="btn-pay" onclick="requestPayment()">토스페이먼츠 결제하기</button>
    </div>
</div>

<script>
    const API_URL = "https://bluebattery.onrender.com";
    let currentUser = "";

    // 토스페이먼츠공공 공식 테스트 클라이언트 키
    const tossPayments = TossPayments("test_ck_D53483MbeDj2q9b233y812W40921");

    // 회원가입 및 로그인 처리
    async function handleAuth(endpoint) {
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value.trim();
        const statusDiv = document.getElementById('auth-status');

        if (!usernameInput || !passwordInput) {
            statusDiv.className = "status error";
            statusDiv.innerText = "아이디와 비밀번호를 모두 입력해주세요.";
            return;
        }

        statusDiv.className = "status";
        statusDiv.innerText = "처리 중...";

        try {
            const res = await fetch(API_URL + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                statusDiv.className = "status success";
                statusDiv.innerText = data.message;
                if (data.username) currentUser = data.username;
            } else {
                statusDiv.className = "status error";
                statusDiv.innerText = data.error || "처리 중 오류가 발생했습니다.";
            }
        } catch (err) {
            statusDiv.className = "status error";
            statusDiv.innerText = "서버 연결 실패! Render 서버 구동 상태를 확인하세요.";
        }
    }

    // 차량 검색 처리
    async function searchCar() {
        const carNumber = document.getElementById('car-number').value.trim();
        const resultDiv = document.getElementById('car-result');

        if (!carNumber) {
            alert("차량 번호를 입력해주세요.");
            return;
        }

        resultDiv.style.display = "block";
        resultDiv.innerHTML = "차량 정보 조회 중...";

        try {
            const res = await fetch(`${API_URL}/api/car/search?carNumber=${encodeURIComponent(carNumber)}`);
            const response = await res.json();

            if (res.ok && response.success) {
                const car = response.data;
                resultDiv.innerHTML = `
                    <strong style="color:#0052cc;">[${car.carNumber} 조회 결과]</strong><br>
                    • <b>모델명:</b> ${car.modelName}<br>
                    • <b>연식:</b> ${car.year}<br>
                    • <b>연료구분:</b> ${car.fuelType}<br>
                    • <b>배기량:</b> ${car.displacement}<br>
                    • <b>등록상태:</b> ${car.status}<br>
                    • <b>배터리 상태:</b> ${car.batteryStatus}
                `;
            } else {
                resultDiv.innerHTML = `<span style="color:red;">${response.error || "차량 정보를 찾을 수 없습니다."}</span>`;
            }
        } catch (err) {
            resultDiv.innerHTML = `<span style="color:red;">서버 통신 오류가 발생했습니다.</span>`;
        }
    }

    // 결제 요청 처리
    function requestPayment() {
        const amount = parseInt(document.getElementById('pay-amount').value);
        if (!amount || amount <= 0) {
            alert("올바른 결제 금액을 입력해주세요.");
            return;
        }

        const orderId = 'BB_' + new Date().getTime();

        tossPayments.requestPayment('카드', {
            amount: amount,
            orderId: orderId,
            orderName: 'BlueBattery 서비스 이용권',
            customerName: currentUser || '비회원 고객',
            successUrl: window.location.href,
            failUrl: window.location.href,
        }).catch(function (error) {
            if (error.code === 'USER_CANCEL') {
                alert('결제가 취소되었습니다.');
            } else {
                alert('결제 오류: ' + error.message);
            }
        });
    }
</script>

</body>
</html>
