<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueBattery - 차량 조회 및 결제 서비스</title>
    <!-- 토스페이먼츠 SDK 연동 -->
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { background: white; width: 100%; max-width: 480px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1a73e8; margin-top: 0; text-align: center; }
        .section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        input { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #1557b0; }
        .btn-pay { background-color: #3182f6; }
        .btn-pay:hover { background-color: #1b64da; }
        .result-box { background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 10px; font-size: 14px; border: 1px solid #e9ecef; }
        .badge { display: inline-block; padding: 4px 8px; background: #e8f0fe; color: #1a73e8; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>BlueBattery 서비스</h2>

    <!-- 1. 계정 섹션 -->
    <div class="section">
        <h3><span class="badge">1단계</span> 계정 로그인</h3>
        <input type="text" id="username" placeholder="아이디">
        <input type="password" id="password" placeholder="비밀번호">
        <div style="display: flex; gap: 10px;">
            <button onclick="handleAuth('/api/login')">로그인</button>
            <button onclick="handleAuth('/api/register')" style="background-color: #5f6368;">회원가입</button>
        </div>
        <div id="auth-status" style="margin-top: 8px; font-weight: bold;"></div>
    </div>

    <!-- 2. 차량 정보 조회 섹션 -->
    <div class="section">
        <h3><span class="badge">2단계</span> 차량 정보 조회</h3>
        <input type="text" id="car-number" placeholder="차량 번호 입력 (예: 12가3456)">
        <button onclick="searchCar()">차량 검색하기</button>
        <div id="car-result" class="result-box" style="display: none;"></div>
    </div>

    <!-- 3. 결제 시스템 섹션 -->
    <div class="section" style="border-bottom: none;">
        <h3><span class="badge">3단계</span> 이용권 및 배터리 서비스 결제</h3>
        <p style="font-size: 13px; color: #666;">실제 토스페이먼츠 결제 연동 테스트 (테스트 결제 진행)</p>
        <input type="number" id="pay-amount" value="10000" placeholder="결제 금액 (원)">
        <button class="btn-pay" onclick="requestPayment()">카드 / 간편결제 진행</button>
    </div>
</div>

<script>
    const API_URL = "https://bluebattery.onrender.com";
    let currentUser = "";

    // 토스페이먼츠 테스트 클라이언트 키
    const tossPayments = TossPayments("test_ck_D53483MbeDj2q9b233y812W40921");

    async function handleAuth(endpoint) {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const statusDiv = document.getElementById('auth-status');

        try {
            const res = await fetch(API_URL + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                statusDiv.style.color = "green";
                statusDiv.innerText = data.message;
                if(data.username) currentUser = data.username;
            } else {
                statusDiv.style.color = "red";
                statusDiv.innerText = data.error;
            }
        } catch (err) {
            statusDiv.style.color = "red";
            statusDiv.innerText = "서버 통신 실패";
        }
    }

    async function searchCar() {
        const carNumber = document.getElementById('car-number').value;
        const resultDiv = document.getElementById('car-result');
        if (!carNumber) return alert("차량 번호를 입력하세요.");

        try {
            const res = await fetch(`${API_URL}/api/car/search?carNumber=${encodeURIComponent(carNumber)}`);
            const response = await res.json();

            if (response.success) {
                const car = response.data;
                resultDiv.style.display = "block";
                resultDiv.innerHTML = `
                    <b>조회 결과:</b><br>
                    - 차량번호: ${car.carNumber}<br>
                    - 모델명: ${car.modelName}<br>
                    - 연식: ${car.year}<br>
                    - 연료: ${car.fuelType}<br>
                    - 배터리/엔진: ${car.displacement} (${car.batteryCapacity})
                `;
            }
        } catch (err) {
            alert("차량 조회 실패");
        }
    }

    function requestPayment() {
        const amount = parseInt(document.getElementById('pay-amount').value);
        if (!amount || amount <= 0) return alert("올바른 금액을 입력해주세요.");

        const orderId = 'ORDER_' + new Date().getTime();

        tossPayments.requestPayment('카드', {
            amount: amount,
            orderId: orderId,
            orderName: 'BlueBattery 서비스 이용권',
            customerName: currentUser || '비회원 고객',
            successUrl: window.location.href,
            failUrl: window.location.href,
        }).catch(function (error) {
            if (error.code === 'USER_CANCEL') {
                alert('결제가 취소되었습니다.');
            } else {
                alert('결제 오류: ' + error.message);
            }
        });
    }
</script>

</body>
</html>
