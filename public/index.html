<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueBattery - 블루카서비스</title>
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 550px; }
        h1 { color: #0056b3; text-align: center; margin-bottom: 20px; font-size: 26px; }
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #e1e1e1; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; background: #e9ecef; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #495057; font-size: 12px; }
        .tab-btn.active { background: #0056b3; color: white; }
        .section { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #333; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
        button.btn-main { width: 100%; padding: 14px; background-color: #0056b3; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        button.btn-main:hover { background-color: #003d80; }
        button.btn-sub { width: 100%; padding: 10px; background-color: #6c757d; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 5px; }
        .hidden { display: none !important; }
        .battery-card { border: 2px solid #e1e1e1; border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; background: #fafafa; }
        .battery-card.selected { border-color: #0056b3; background-color: #f0f7ff; }
        .price { font-weight: bold; color: #d9534f; float: right; }
        .user-header { display: flex; justify-content: space-between; align-items: center; background: #eef5ff; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        .error-msg { color: #d9534f; font-size: 13px; text-align: center; margin-top: 8px; }
        .admin-badge { background: #dc3545; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h1>BlueBattery</h1>

    <!-- 1. 로그인 / 회원가입 화면 -->
    <div id="view-auth">
        <div id="login-box" class="section">
            <label>이메일 로그인</label>
            <input type="email" id="loginEmail" placeholder="이메일 주소">
            <input type="password" id="loginPw" placeholder="비밀번호">
            <button class="btn-main" onclick="handleLogin()">로그인</button>
            <button class="btn-sub" onclick="toggleAuth('register')">회원가입으로 이동</button>
        </div>

        <div id="register-box" class="section hidden">
            <label>신규 회원가입</label>
            <input type="text" id="regName" placeholder="성명">
            <input type="text" id="regPhone" placeholder="휴대전화번호 (- 없이 입력)">
            <input type="email" id="regEmail" placeholder="이메일 주소">
            <input type="password" id="regPw" placeholder="비밀번호">
            <button class="btn-main" onclick="handleRegister()">회원가입 완료</button>
            <button class="btn-sub" onclick="toggleAuth('login')">로그인으로 이동</button>
        </div>
        <p id="auth-error" class="error-msg"></p>
    </div>

    <!-- 2. 메인 대시보드 (로그인 성공 시) -->
    <div id="view-dashboard" class="hidden">
        <div class="user-header">
            <div>
                <span id="user-info-text">님 환영합니다!</span>
                <span id="admin-tag" class="admin-badge hidden">관리자</span>
            </div>
            <button onclick="handleLogout()" style="padding: 4px 8px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">로그아웃</button>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('car')">1. 차량 조회</button>
            <button class="tab-btn" onclick="switchTab('battery')">2. 배터리 목록</button>
            <button class="tab-btn" onclick="switchTab('reserve')">3. 교체 예약</button>
            <button id="admin-tab-btn" class="tab-btn hidden" style="background:#dc3545; color:white;" onclick="switchTab('admin')">관리자 시스템</button>
        </div>

        <!-- 탭 1: 차량 조회 -->
        <div id="tab-car" class="tab-content">
            <label>국토부 실시간 차량 조회</label>
            <input type="text" id="carNo" placeholder="차량번호 (예: 16러4490)">
            <input type="text" id="ownerName" placeholder="소유자 성명 (예: 홍길동)">
            <button class="btn-main" onclick="searchCar()">차량 조회하기</button>
            <p id="car-error" class="error-msg"></p>
        </div>

        <!-- 탭 2: 배터리 목록 -->
        <div id="tab-battery" class="tab-content hidden">
            <label>선택 가능 배터리 목록</label>
            <div id="battery-list">
                <p style="font-size: 13px; color: #666; text-align: center;">차량 조회를 먼저 진행하시거나 목록에서 선택해 주세요.</p>
            </div>
        </div>

        <!-- 탭 3: 교체 예약 및 카드 결제 -->
        <div id="tab-reserve" class="tab-content hidden">
            <label>배터리 교체 예약 및 결제</label>
            <select id="serviceType">
                <option value="visit">출장 교체 서비스</option>
                <option value="branch">지점 방문 교체</option>
            </select>
            <input type="text" id="custPhone" placeholder="연락처 (- 없이 입력)">
            <input type="datetime-local" id="reserveDate">
            <input type="text" id="address" placeholder="방문 주소">

            <div style="margin: 15px 0; padding: 10px; background: #f8f9fa; border-radius: 6px;">
                <label style="margin:0;">카드 관리 및 결제 옵션</label>
                <button class="btn-sub" onclick="registerCard()" style="background: #28a745; margin-top: 8px;">실제 자동결제 카드 등록</button>
            </div>

            <button class="btn-main" onclick="requestPayment()">결제 및 예약하기</button>
        </div>

        <!-- 탭 4: 관리자 전용 시스템 -->
        <div id="tab-admin" class="tab-content hidden">
            <label>시스템 예약 / 회원 현황 관리</label>
            <button class="btn-sub" onclick="loadAdminData()" style="background:#0056b3; margin-bottom:10px;">데이터 새로고침</button>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>고객이메일</th>
                            <th>차량번호</th>
                            <th>배터리</th>
                            <th>상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="admin-reservation-list">
                        <tr><td colspan="6" style="text-align:center;">데이터를 불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = "https://bluebattery.onrender.com";
    let currentUser = null;
    let selectedBattery = null;
    let currentCarData = { carNo: '' };

    window.onload = () => {
        const token = localStorage.getItem('bt_token');
        const user = localStorage.getItem('bt_user');
        if (token && user) {
            currentUser = JSON.parse(user);
            showDashboard();
        }
    };

    function toggleAuth(type) {
        document.getElementById('login-box').classList.toggle('hidden', type !== 'login');
        document.getElementById('register-box').classList.toggle('hidden', type !== 'register');
        document.getElementById('auth-error').innerText = '';
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPw').value.trim();
        try {
            const res = await fetch(`${API_BASE_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if(!res.ok) throw new Error(data.message);

            localStorage.setItem('bt_token', data.token);
            localStorage.setItem('bt_user', JSON.stringify(data.user));
            currentUser = data.user;
            showDashboard();
        } catch(e) { document.getElementById('auth-error').innerText = e.message; }
    }

    async function handleRegister() {
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPw').value.trim();

        if(!name || !phone || !email || !password) {
            return document.getElementById('auth-error').innerText = "모든 항목을 입력해야 합니다.";
        }

        try {
            const res = await fetch(`${API_BASE_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone, email, password })
            });
            const data = await res.json();
            if(!res.ok) throw new Error(data.message);

            localStorage.setItem('bt_token', data.token);
            localStorage.setItem('bt_user', JSON.stringify(data.user));
            currentUser = data.user;
            showDashboard();
        } catch(e) { document.getElementById('auth-error').innerText = e.message; }
    }

    function handleLogout() {
        localStorage.removeItem('bt_token');
        localStorage.removeItem('bt_user');
        location.reload();
    }

    function showDashboard() {
        document.getElementById('view-auth').classList.add('hidden');
        document.getElementById('view-dashboard').classList.remove('hidden');
        document.getElementById('user-info-text').innerText = `${currentUser.name} (${currentUser.email}) 님`;
        document.getElementById('custPhone').value = currentUser.phone || '';

        if (currentUser.role === 'admin') {
            document.getElementById('admin-tag').classList.remove('hidden');
            document.getElementById('admin-tab-btn').classList.remove('hidden');
        }

        loadDefaultBatteries();
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
        
        event.target.classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.remove('hidden');

        if(tabName === 'admin') loadAdminData();
    }

    async function searchCar() {
        const carNo = document.getElementById('carNo').value.trim();
        const ownerName = document.getElementById('ownerName').value.trim();
        const errorEl = document.getElementById('car-error');
        errorEl.innerText = "조회 중입니다...";

        try {
            const res = await fetch(`${API_BASE_URL}/api/car-search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ carNo, ownerName })
            });
            const data = await res.json();
            if(!res.ok) throw new Error(data.message);

            errorEl.innerText = "";
            currentCarData = data;
            renderBatteries(data.recommendedBatteries);
            alert(`${data.carModel} 차량 조회가 완료되었습니다.`);
        } catch(e) { errorEl.innerText = e.message; }
    }

    function loadDefaultBatteries() {
        renderBatteries([
            { name: '로케트/델코 범용 맞춤 배터리 (80Ah)', price: 120000 },
            { name: '로케트 AGM80 (스탑앤고 고성능)', price: 145000 }
        ]);
    }

    function renderBatteries(batteries) {
        const listEl = document.getElementById('battery-list');
        listEl.innerHTML = "";
        batteries.forEach((b, idx) => {
            const card = document.createElement('div');
            card.className = `battery-card ${idx === 0 ? 'selected' : ''}`;
            if(idx === 0) selectedBattery = b;
            card.innerHTML = `<span>${b.name}</span><span class="price">${b.price.toLocaleString()}원</span>`;
            card.onclick = () => {
                document.querySelectorAll('.battery-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedBattery = b;
            };
            listEl.appendChild(card);
        });
    }

    function registerCard() {
        PortOne.requestIssueBillingKey({
            storeId: "store-218227ec-15b5-4b36-a3ee-8bf589410ef3",
            channelKey: "channel-key-toss-pay",
            billingKeyPaymentMethod: "CARD"
        }).then(async (response) => {
            if (response.code != null) return alert(`카드 등록 실패: ${response.message}`);
            
            await fetch(`${API_BASE_URL}/api/save-card`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentUser.email, billingKey: response.billingKey })
            });
            alert('자동결제 카드가 성공적으로 등록되었습니다.');
        });
    }

    async function requestPayment() {
        if(!selectedBattery) return alert('배터리를 먼저 선택해주세요.');
        const phone = document.getElementById('custPhone').value.trim();
        const date = document.getElementById('reserveDate').value;
        const address = document.getElementById('address').value.trim();
        if(!phone || !date) return alert('연락처와 예약 일시를 입력해주세요.');

        PortOne.requestPayment({
            storeId: "store-218227ec-15b5-4b36-a3ee-8bf589410ef3",
            channelKey: "channel-key-toss-pay",
            paymentId: `pay_${Date.now()}`,
            orderName: `[BlueBattery] ${selectedBattery.name}`,
            totalAmount: selectedBattery.price,
            currency: "CURRENCY_KRW",
            payMethod: "CARD"
        }).then(async (response) => {
            if (response.code != null) return alert(`결제 실패: ${response.message}`);
            
            await fetch(`${API_BASE_URL}/api/reserve`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userEmail: currentUser.email,
                    paymentId: response.paymentId,
                    carNo: currentCarData.carNo || '미조회',
                    batteryName: selectedBattery.name,
                    phone: phone,
                    reserveDate: date,
                    address: address
                })
            });
            alert('결제 및 예약 접수가 완료되었습니다.');
            location.reload();
        });
    }

    // 관리자 데이터 불러오기
    async function loadAdminData() {
        const tbody = document.getElementById('admin-reservation-list');
        try {
            const res = await fetch(`${API_BASE_URL}/api/admin/reservations`);
            const data = await res.json();
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>접수된 예약이 없습니다.</td></tr>";
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.user_email}</td>
                    <td>${item.car_no}</td>
                    <td>${item.battery_name}</td>
                    <td><b>${item.status || '접수완료'}</b></td>
                    <td>
                        <button onclick="updateStatus(${item.id}, '작업완료')" style="padding:2px 5px; background:#28a745; color:white; border:none; border-radius:3px;">완료</button>
                        <button onclick="updateStatus(${item.id}, '취소')" style="padding:2px 5px; background:#dc3545; color:white; border:none; border-radius:3px;">취소</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch(e) { alert("관리자 데이터를 불러오는 데 실패했습니다."); }
    }

    async function updateStatus(id, status) {
        await fetch(`${API_BASE_URL}/api/admin/update-status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, status })
        });
        loadAdminData();
    }
</script>

</body>
</html>
