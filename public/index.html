<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueBattery - 자동차 배터리 관리 플랫폼</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; }
        h1 { color: #0056b3; font-size: 24px; text-align: center; margin-bottom: 20px; }
        .section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #333; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #004085; }
        .btn-group { display: flex; gap: 10px; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-pay { background-color: #198754; margin-top: 10px; }
        .btn-pay:hover { background-color: #146c43; }
        .result-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; margin-top: 10px; line-height: 1.6; font-size: 14px; }
        .error-msg { color: #dc3545; font-size: 13px; margin-top: 5px; text-align: center; }
        .success-msg { color: #198754; font-size: 13px; margin-top: 5px; text-align: center; }
    </style>
    <script src="https://js.tosspayments.com/v1/payment"></script>
</head>
<body>

<div class="container">
    <h1>BlueBattery</h1>

    <!-- 1. 로그인 / 회원가입 -->
    <div class="section">
        <div class="section-title">1. 회원 서비스</div>
        <input type="text" id="username" placeholder="아이디 (이메일)">
        <input type="password" id="password" placeholder="비밀번호">
        <div class="btn-group">
            <button onclick="handleLogin()">로그인</button>
            <button class="btn-secondary" onclick="handleRegister()">회원가입</button>
        </div>
        <div id="authMessage"></div>
    </div>

    <!-- 2. 차량 실시간 정보 조회 -->
    <div class="section">
        <div class="section-title">2. 차량 실시간 정보 조회</div>
        <input type="text" id="carInput" placeholder="차량 번호 입력 (예: 16러4490)">
        <button onclick="searchCar()">차량 정보 검색</button>
        <div id="carResult"></div>
    </div>

    <!-- 3. 이용권 구매 및 결제 -->
    <div class="section" style="border-bottom: none; margin-bottom: 0;">
        <div class="section-title">3. 이용권 구매 및 결제 테스트</div>
        <input type="number" id="payAmount" value="10000" readonly style="background:#eee;">
        <button class="btn-pay" onclick="payWithToss()">토스페이먼츠 결제하기</button>
    </div>
</div>

<script>
    // 백엔드 서버 URL 설정
    const API_BASE_URL = 'https://bluebattery.onrender.com';

    // 토스페이먼츠 클라이언트 테스트 키
    const clientKey = 'test_ck_D53483Lbe251705e4B53da947F0a';
    let tossPayments = null;
    
    try {
        tossPayments = TossPayments(clientKey);
    } catch(e) {
        console.error("토스 SDK 로드 실패:", e);
    }

    async function handleRegister() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const msgDiv = document.getElementById('authMessage');

        try {
            const res = await fetch(`${API_BASE_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                msgDiv.className = 'success-msg';
                msgDiv.innerText = data.message;
            } else {
                msgDiv.className = 'error-msg';
                msgDiv.innerText = data.error;
            }
        } catch (err) {
            msgDiv.className = 'error-msg';
            msgDiv.innerText = '서버 통신 오류가 발생했습니다.';
        }
    }

    async function handleLogin() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const msgDiv = document.getElementById('authMessage');

        try {
            const res = await fetch(`${API_BASE_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                msgDiv.className = 'success-msg';
                msgDiv.innerText = data.message;
            } else {
                msgDiv.className = 'error-msg';
                msgDiv.innerText = data.error;
            }
        } catch (err) {
            msgDiv.className = 'error-msg';
            msgDiv.innerText = '서버 통신 오류가 발생했습니다.';
        }
    }

    async function searchCar() {
        const carNumber = document.getElementById('carInput').value;
        const resultDiv = document.getElementById('carResult');
        resultDiv.innerHTML = '<p style="text-align:center; margin-top:10px;">조회 중...</p>';
        
        try {
            const res = await fetch(`${API_BASE_URL}/api/car/search?carNumber=${encodeURIComponent(carNumber)}`);
            const data = await res.json();
            
            if (data.success) {
                resultDiv.innerHTML = `
                    <div class="result-box">
                        <strong style="color:#0056b3;">[${data.data.carNumber} 조회 결과]</strong><br>
                        • <strong>모델명:</strong> ${data.data.modelName}<br>
                        • <strong>연식:</strong> ${data.data.year}<br>
                        • <strong>연료구분:</strong> ${data.data.fuelType}<br>
                        • <strong>배기량:</strong> ${data.data.displacement}<br>
                        • <strong>등록상태:</strong> ${data.data.status}<br>
                        • <strong>배터리 상태:</strong> ${data.data.batteryStatus}
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `<p class="error-msg" style="margin-top:10px;">${data.error}</p>`;
            }
        } catch (err) {
            resultDiv.innerHTML = `<p class="error-msg" style="margin-top:10px;">서버 통신 오류가 발생했습니다.</p>`;
        }
    }

    function payWithToss() {
        if (!tossPayments) {
            alert("결제 모듈이 올바르게 로드되지 않았습니다.");
            return;
        }
        const amount = document.getElementById('payAmount').value || 10000;
        
        tossPayments.requestPayment('카드', {
            amount: parseInt(amount),
            orderId: 'ORDER_' + new Date().getTime(),
            orderName: 'BlueBattery 이용권 결제',
            customerName: '구매자',
            successUrl: window.location.origin + '/success.html',
            failUrl: window.location.origin + '/fail.html',
        }).catch(function (error) {
            if (error.code === 'USER_CANCEL') {
                alert('결제를 취소하셨습니다.');
            } else {
                alert('결제 오류: ' + error.message);
            }
        });
    }
</script>

</body>
</html>
