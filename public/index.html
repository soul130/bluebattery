<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueBattery - 차량 조회 & 배터리 교체 예약</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        h1 { color: #0056b3; font-size: 22px; text-align: center; margin-bottom: 20px; }
        .section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .section-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: #333; }
        input, select { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #004085; }
        .card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; margin-top: 10px; font-size: 14px; line-height: 1.5; }
        .highlight { color: #0056b3; font-weight: bold; }
        .hidden { display: none; }
        .price { font-size: 18px; color: #d9534f; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>BlueBattery</h1>

    <!-- 1단계: 차량 조회 -->
    <div class="section">
        <div class="section-title">1. 차량 번호 및 소유자 조회</div>
        <input type="text" id="carNumber" placeholder="차량 번호 (예: 12가3456)">
        <input type="text" id="ownerName" placeholder="소유자명 또는 주민번호 앞자리">
        <button onclick="searchCar()">맞춤 배터리 찾기</button>
    </div>

    <!-- 2단계: 조회 결과 및 배터리 추천 (조회 후 표시) -->
    <div id="step2" class="section hidden">
        <div class="section-title">2. 추천 맞춤 배터리</div>
        <div class="card">
            <div id="batteryName" class="highlight" style="font-size: 16px;"></div>
            <div id="batteryDesc" style="color: #666; font-size: 13px; margin: 4px 0;"></div>
            <div id="batteryPrice" class="price"></div>
        </div>
    </div>

    <!-- 3단계: 배터리 구매 & 교체 예약 -->
    <div id="step3" class="section hidden" style="border-bottom: none; margin-bottom: 0;">
        <div class="section-title">3. 배터리 구매 & 교체 예약</div>
        
        <label style="font-size: 13px; color: #555;">교체 방식 선택</label>
        <select id="serviceType">
            <option value="출장교체">방문 출장 교체 (기사님 방문)</option>
            <option value="지점방문">지점 방문 교체 (매장 방문)</option>
        </select>

        <input type="datetime-local" id="reserveDate">
        <input type="text" id="address" placeholder="출장 장소 주소 또는 방문 희망 지점">
        <input type="tel" id="phone" placeholder="연락처 (- 없이 입력)">

        <button onclick="submitReservation()" style="background-color: #28a745;">구매 및 교체 예약 신청</button>
    </div>

    <div id="statusMsg" style="text-align: center; font-size: 14px; margin-top: 10px;"></div>
</div>

<script>
    let currentBattery = null;

    async function searchCar() {
        const carNumber = document.getElementById('carNumber').value;
        const ownerName = document.getElementById('ownerName').value;
        const statusMsg = document.getElementById('statusMsg');

        if (!carNumber || !ownerName) {
            alert('차량번호와 소유자명을 입력해주세요.');
            return;
        }

        statusMsg.style.color = '#666';
        statusMsg.innerText = '차량 제원 조회 및 배터리 매칭 중...';

        try {
            const res = await fetch('/api/car-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ carNumber, ownerName })
            });
            const result = await res.json();

            if (result.success) {
                currentBattery = result.battery;
                document.getElementById('batteryName').innerText = result.battery.modelName;
                document.getElementById('batteryDesc').innerText = result.battery.description;
                document.getElementById('batteryPrice').innerText = result.battery.price.toLocaleString() + '원 (공임비 포함)';

                document.getElementById('step2').classList.remove('hidden');
                document.getElementById('step3').classList.remove('hidden');
                statusMsg.innerText = '';
            } else {
                statusMsg.style.color = 'red';
                statusMsg.innerText = result.message || '조회에 실패했습니다.';
            }
        } catch (err) {
            statusMsg.style.color = 'red';
            statusMsg.innerText = '서버와 통신할 수 없습니다.';
        }
    }

    async function submitReservation() {
        const carNumber = document.getElementById('carNumber').value;
        const serviceType = document.getElementById('serviceType').value;
        const date = document.getElementById('reserveDate').value;
        const address = document.getElementById('address').value;
        const phone = document.getElementById('phone').value;

        if (!date || !address || !phone) {
            alert('예약 일시, 주소, 연락처를 모두 입력해 주세요.');
            return;
        }

        const res = await fetch('/api/reservation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                carNumber,
                batteryName: currentBattery ? currentBattery.modelName : '',
                serviceType,
                date,
                address,
                phone
            })
        });

        const result = await res.json();
        if (result.success) {
            alert('🎉 예약 및 구매 접수가 완료되었습니다!\n확인 후 기사님이 연락드릴 예정입니다.');
            location.reload();
        } else {
            alert(result.message || '예약 실패');
        }
    }
</script>

</body>
</html>
